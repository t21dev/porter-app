name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # One draft release, created before any build starts, so the parallel build
  # jobs upload into the same release instead of each creating their own.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          # The app's update dialog shows these notes, and Porter 0.5 and older
          # render each line on its own, so join the changelog's wrapped lines
          # into their bullet or paragraph.
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2 \
            | awk 'NR > 1 && /^  [^ -]/ { sub(/^ +/, ""); line = line " " $0; next }
                   { if (NR > 1) print line; line = $0 }
                   END { print line }')
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          cat > body.md <<EOF
          ## What's Changed
          $NOTES

          ## 📦 Downloads
          Choose the appropriate installer for your platform below. On Windows,
          the \`_portable.zip\` runs without installing and keeps its data
          next to the exe.

          ## 🚀 Installation
          Installation guide: https://github.com/t21dev/porter-app#installation
          EOF
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Porter v$VERSION" \
            -F draft=true -F prerelease=false -F body=@body.md --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # A zip that runs without installing. The `portable` file next to the
      # exe keeps all data in a `data` folder beside it.
      - name: Portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "Porter"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "src-tauri/target/release/porter-app.exe" "$dir/Porter.exe"
          Set-Content "$dir/portable" "Porter keeps its data in the data folder next to it while this file is here. Delete this file to use the normal per-user data folder instead. Needs the Microsoft Edge WebView2 Runtime, which Windows 10 and 11 already have."
          $zip = "Porter_${version}_x64_portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          # Straight to the release by id: a draft has no public tag to look up.
          gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$zip" `
            -H "Content-Type: application/zip" --input $zip --jq .name

  # Once every build has uploaded, list the SHA-256 of each download: as
  # SHA256SUMS.txt beside them, and at the end of the release notes.
  checksums:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA-256 of every download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dl
          gh api "repos/$REPO/releases/$ID/assets" --paginate --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r asset name; do
              [ "$name" = "SHA256SUMS.txt" ] && continue
              gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > "dl/$name"
            done
          (cd dl && sha256sum -- * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input SHA256SUMS.txt --jq .name
          gh api "repos/$REPO/releases/$ID" --jq .body > body.md
          # Only a pointer in the notes: older Porter versions show the notes in
          # their update dialog, and a block of hashes scrolls sideways there.
          printf '\n## SHA-256 checksums\nThe checksum of every file is in SHA256SUMS.txt, attached below.\n' >> body.md
          # The tag goes with the edit: without it a draft loses its tag.
          gh api -X PATCH "repos/$REPO/releases/$ID" -f tag_name="$TAG" -F body=@body.md --jq .html_url
