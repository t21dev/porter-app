[package]
name = "porter-cli"
version = "0.8.3"
description = "Porter in the terminal: what's listening on which port, and whether it should be"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "porter"
path = "src/main.rs"

[dependencies]
porter-core = { path = "../porter-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
