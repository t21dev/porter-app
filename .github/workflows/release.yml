name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # One draft release, created before any build starts, so the parallel build
  # jobs upload into the same release instead of each creating their own.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          # The app's update dialog shows these notes, and Porter 0.5 and older
          # render each line on its own, so join the changelog's wrapped lines
          # into their bullet or paragraph.
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2 \
            | awk 'NR > 1 && /^  [^ -]/ { sub(/^ +/, ""); line = line " " $0; next }
                   { if (NR > 1) print line; line = $0 }
                   END { print line }')
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          cat > body.md <<EOF
          ## What's Changed
          $NOTES

          ## 📦 Downloads
          Choose the appropriate installer for your platform below. On Windows,
          the \`_portable.zip\` runs without installing and keeps its data
          next to the exe.

          Or with a package manager: \`brew install --cask t21dev/tap/porter-app\`
          on macOS; \`scoop bucket add t21dev https://github.com/t21dev/scoop-bucket\`
          and then \`scoop install t21dev/porter\` on Windows.

          On a server or in a terminal, \`porter-cli_*\` holds \`porter\`, the
          terminal version: one file with no dependencies. Run \`sudo porter\`
          for the live view or \`porter audit\` for a report.

          ## 🚀 Installation
          Installation guide: https://github.com/t21dev/porter-app#installation
          EOF
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Porter v$VERSION" \
            -F draft=true -F prerelease=false -F body=@body.md --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # macos-latest builds the Apple silicon dmg, macos-15-intel the Intel one
        # (Porter_x.y.z_x64.dmg); the Homebrew cask needs both.
        platform: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Link the Visual C++ runtime into Porter.exe. Without it the exe needs
          # VCRUNTIME140.dll, which a clean Windows install doesn't have.
          STATIC_VCRUNTIME: "true"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # A zip that runs without installing. The `portable` file next to the
      # exe keeps all data in a `data` folder beside it.
      - name: Portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "Porter"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "src-tauri/target/release/porter-app.exe" "$dir/Porter.exe"
          # porter, the terminal version, in cli\ (porter.exe can't sit beside
          # Porter.exe). Settings > Command line tool puts that folder on the PATH.
          New-Item -ItemType Directory "$dir/cli" | Out-Null
          Copy-Item "src-tauri/binaries/porter-x86_64-pc-windows-msvc.exe" "$dir/cli/porter.exe"
          Set-Content "$dir/portable" "Porter keeps its data in the data folder next to it while this file is here. Delete this file to use the normal per-user data folder instead. Needs the Microsoft Edge WebView2 Runtime, which Windows 10 and 11 already have."
          $zip = "Porter_${version}_x64_portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          # Straight to the release by id: a draft has no public tag to look up.
          gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$zip" `
            -H "Content-Type: application/zip" --input $zip --jq .name

      # The Microsoft Store package. Unsigned on purpose: the Store signs it, and
      # Partner Center takes it as an upload, so it isn't in the GitHub release.
      - name: MSIX for the Microsoft Store (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          npm install -g @microsoft/winappcli@0.8.0
          ./scripts/build-msix.ps1

      - name: Keep the MSIX as a workflow artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: porter-msix
          path: src-tauri/target/msix/*.msix

      # The Flatpak, repackaged from the .deb that tauri-action just built.
      - name: Flatpak bundle (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y flatpak
          FILE="Porter_${GITHUB_REF_NAME#v}_x86_64.flatpak"
          bash flatpak/build.sh src-tauri/target/release/bundle/deb/*.deb "$FILE"
          gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$FILE" \
            -H "Content-Type: application/octet-stream" --input "$FILE" --jq .name

  # `porter`, the terminal version, as one self-contained file per platform.
  # Static on Linux (musl), so the same file runs on any distribution, on a
  # bare VPS and in containers.
  cli:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: cli-${{ matrix.target }}

      - name: Build porter
        shell: bash
        run: |
          # The Visual C++ runtime linked in, as for the app (see above).
          if [[ "${{ matrix.target }}" == *windows* ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked -p porter-cli --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="src-tauri/target/${{ matrix.target }}/release"
          # No version in the name, so releases/latest/download/<file> always works.
          NAME="porter-cli_${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            FILE="$NAME.zip"
            7z a -tzip "$FILE" "./$DIR/porter.exe" > /dev/null
          else
            FILE="$NAME.tar.gz"
            tar -czf "$FILE" -C "$DIR" porter
          fi
          gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$FILE"             -H "Content-Type: application/octet-stream" --input "$FILE" --jq .name

  # Once every build has uploaded, list the SHA-256 of each download: as
  # SHA256SUMS.txt beside them, and at the end of the release notes.
  checksums:
    needs: [create-release, release, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA-256 of every download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dl
          gh api "repos/$REPO/releases/$ID/assets" --paginate --jq '.[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r asset name; do
              [ "$name" = "SHA256SUMS.txt" ] && continue
              gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > "dl/$name"
            done
          (cd dl && sha256sum -- * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input SHA256SUMS.txt --jq .name
          gh api "repos/$REPO/releases/$ID" --jq .body > body.md
          # Only a pointer in the notes: older Porter versions show the notes in
          # their update dialog, and a block of hashes scrolls sideways there.
          printf '\n## SHA-256 checksums\nThe checksum of every file is in SHA256SUMS.txt, attached below.\n' >> body.md
          # The tag goes with the edit: without it a draft loses its tag. Every
          # build and the checksums are uploaded by now, so publish it as latest.
          gh api -X PATCH "repos/$REPO/releases/$ID" -f tag_name="$TAG" -F body=@body.md \
            -F draft=false -f make_latest=true --jq .html_url

  # The Homebrew cask (t21dev/homebrew-tap) follows the release at once, so
  # `brew upgrade` sees it within minutes instead of waiting for the tap's
  # six-hourly autobump PR. HOMEBREW_TAP_TOKEN: a token that can push to the
  # tap (classic, public_repo scope).
  homebrew:
    needs: [checksums]
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Update the cask
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set; the tap's autobump will catch up instead"
            exit 0
          fi
          # A secret pasted with a trailing newline breaks the clone URL.
          TAP_TOKEN=$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')
          VERSION="${TAG#v}"
          gh release download "$TAG" -R "$REPO" -p SHA256SUMS.txt
          sum() { awk -v f="$1" '$2 == f || $2 == "*" f { print $1 }' SHA256SUMS.txt; }
          ARM=$(sum "Porter_${VERSION}_aarch64.dmg")
          INTEL=$(sum "Porter_${VERSION}_x64.dmg")
          if [ ${#ARM} -ne 64 ] || [ ${#INTEL} -ne 64 ]; then
            echo "::warning::A macOS disk image is missing from the release; the cask is left as it is"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/t21dev/homebrew-tap.git" tap
          cd tap
          CASK=Casks/porter-app.rb
          # Once: the cask from before Intel builds (one Apple silicon dmg)
          # becomes a cask with one dmg per arch, filled in below.
          if ! grep -q '^  arch arm:' "$CASK"; then
            Z=$(printf '0%.0s' $(seq 64))
            perl -0pi -e '
              s/^  version "[^"]+"\n  sha256 "[0-9a-f]{64}"\n/  arch arm: "aarch64", intel: "x64"\n\n  version "0"\n  sha256 arm:   "'"$Z"'",\n         intel: "'"$Z"'"\n/m;
              s/_aarch64\.dmg"/_#{arch}.dmg"/;
              s/^  # Releases ship an Apple silicon build only\..*\n//m;
              s/^  depends_on arch: :arm64\n//m;
            ' "$CASK"
          fi
          # Once: link porter, the terminal version inside the app (from 0.8.1),
          # so `brew install` puts it on the PATH.
          if ! grep -q 'Contents/MacOS/porter"' "$CASK"; then
            sed -i 's|^  app "Porter.app"$|  app "Porter.app"\n  binary "#{appdir}/Porter.app/Contents/MacOS/porter"|' "$CASK"
          fi
          sed -E -i \
            -e "s/^(  version \")[^\"]+\"/\1${VERSION}\"/" \
            -e "s/(arm: +\")[0-9a-f]{64}\"/\1${ARM}\"/" \
            -e "s/(intel: +\")[0-9a-f]{64}\"/\1${INTEL}\"/" \
            "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "$ARM" "$CASK"
          grep -q "$INTEL" "$CASK"
          grep -q '_#{arch}.dmg"' "$CASK"
          if git diff --quiet; then
            echo "The cask already has $VERSION"
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "porter-app ${VERSION}"
          git push origin HEAD
